<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieExpress | Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #fff8f5;
      font-family: 'Poppins', sans-serif;
    }
    .navbar-custom {
      background: linear-gradient(90deg, #ff512f, #dd2476);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .navbar-brand {
      color: #fff !important;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .nav-link {
      color: #fff !important;
    }
    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
    }
    .qty-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #dd2476;
      font-weight: bold;
    }
    .checkout-btn {
      background: linear-gradient(90deg, #ff512f, #dd2476);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 25px;
      font-weight: 600;
    }
    .hidden {
      display: none;
    }


    /* payment */

    .list-group-item.active-option {
  background: linear-gradient(90deg, #ff512f, #dd2476);
  color: white;
  font-weight: 600;
}

.select-dot::before {
  content: "";
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid #dd2476;
  border-radius: 50%;
  margin-left: 10px;
}

.active-option .select-dot::before {
  background-color: white;
  border-color: white;
}

  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">FoodieExpress</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <a class="btn btn-light ms-3 fw-semibold" href="cart.html">
          <i class="bi bi-cart"></i> Cart
        </a>
      </div>
    </div>
  </nav>

  <!-- 🛒 CART SECTION -->
  <div id="cartSection" class="container my-5">
    <h2 class="text-center fw-bold mb-4" style="color:#dd2476;">🛒 Your Cart</h2>
    <div id="cartContainer" class="bg-white shadow rounded p-4"></div>
    <div class="text-end mt-4">
      <h5>Total: ₹<span id="totalPrice">0</span></h5>
      <button class="checkout-btn mt-3" onclick="goToPayment()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- 💳 PAYMENT SECTION -->
  <div id="paymentSection" class="container my-5 hidden">
  <h2 class="text-center fw-bold mb-4" style="color:#dd2476;">💳 Select Payment Method</h2>

  <div class="list-group shadow" id="paymentOptions">
    <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="selectPayment('Card', this)">
      <span>💳 Credit / Debit Card</span>
      <span class="select-dot"></span>
    </button>
    <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="selectPayment('UPI', this)">
      <span>📱 UPI (Google Pay / PhonePe / Paytm)</span>
      <span class="select-dot"></span>
    </button>
    <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="selectPayment('Netbanking', this)">
      <span>🏦 Net Banking</span>
      <span class="select-dot"></span>
    </button>
    <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="selectPayment('Cash on Delivery', this)">
      <span>💵 Cash on Delivery</span>
      <span class="select-dot"></span>
    </button>
  </div>
</div>

  <!-- 🏠 ADDRESS SECTION -->
  <div id="addressSection" class="container my-5 hidden">
    <h2 class="text-center fw-bold mb-4" style="color:#dd2476;">🏠 Delivery Address</h2>
    <form id="addressForm" class="shadow p-4 bg-white rounded">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Full Name" required>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Mobile Number" required>
      </div>
      <div class="mb-3">
        <textarea class="form-control" placeholder="Full Address" rows="3" required></textarea>
      </div>
      <button type="submit" class="checkout-btn w-100">Confirm Order</button>
    </form>
  </div>

  <!-- ✅ CONFIRMATION SECTION -->
  <div id="confirmSection" class="container text-center my-5 hidden">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
    <h3 class="fw-bold mt-3">Order Confirmed!</h3>
    <p class="text-muted">Your order has been placed successfully.  
    Thank you for choosing <b>FoodieExpress</b>! 🍕</p>
    <button class="btn btn-outline-success mt-3" onclick="goHome()">Go to Home</button>
  </div>

  <!-- SCRIPT -->
  <script>
    const cartContainer = document.getElementById('cartContainer');
    const totalPriceEl = document.getElementById('totalPrice');
    const cartSection = document.getElementById('cartSection');
    const paymentSection = document.getElementById('paymentSection');
    const addressSection = document.getElementById('addressSection');
    const confirmSection = document.getElementById('confirmSection');

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let selectedPayment = null;

    // Render Cart
    function renderCart() {
      if (cart.length === 0) {
        cartContainer.innerHTML = `<p class="text-center text-muted">Your cart is empty.</p>`;
        totalPriceEl.textContent = 0;
        return;
      }

      cartContainer.innerHTML = cart.map(item => `
        <div class="d-flex align-items-center justify-content-between cart-item">
          <div class="d-flex align-items-center">
            <img src="${item.img}" alt="${item.name}" class="me-3">
            <div>
              <h6 class="mb-0">${item.name}</h6>
              <small class="text-muted">₹${item.price}</small>
            </div>
          </div>
          <div>
            <button class="qty-btn" onclick="decreaseQty('${item.name}')"><i class="bi bi-dash-circle"></i></button>
            <span class="mx-2">${item.qty}</span>
            <button class="qty-btn" onclick="increaseQty('${item.name}')"><i class="bi bi-plus-circle"></i></button>
          </div>
          <h6 class="mb-0">₹${item.price * item.qty}</h6>
        </div>
      `).join('');

      totalPriceEl.textContent = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    }

    // Quantity Controls
    function increaseQty(name) {
      const item = cart.find(i => i.name === name);
      if (item) item.qty++;
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function decreaseQty(name) {
      const item = cart.find(i => i.name === name);
      if (item) {
        item.qty--;
        if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    // Navigation Between Sections
    function goToPayment() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      cartSection.classList.add('hidden');
      paymentSection.classList.remove('hidden');
    }

    function selectPayment(method, element) {
    selectedPayment = method;

  // Remove highlight from all
  document.querySelectorAll("#paymentOptions .list-group-item").forEach(btn => {
    btn.classList.remove("active-option");
  });

  // Highlight selected one
  element.classList.add("active-option");

  // Move to address section after a short delay
  setTimeout(() => {
    paymentSection.classList.add('hidden');
    addressSection.classList.remove('hidden');
  }, 600);
}


  document.getElementById('addressForm').addEventListener('submit', (e) => {
  e.preventDefault();

  // Get address details
  const name = e.target[0].value;
  const mobile = e.target[1].value;
  const address = e.target[2].value;

  const order = {
    id: Date.now(),
    items: cart,
    total: cart.reduce((sum, i) => sum + i.price * i.qty, 0),
    paymentMethod: selectedPayment,
    name,
    mobile,
    address,
    date: new Date().toLocaleString(),
  };

  // Save order to localStorage
  const orders = JSON.parse(localStorage.getItem('orders')) || [];
  orders.push(order);
  localStorage.setItem('orders', JSON.stringify(orders));

  // Clear cart
  localStorage.removeItem('cart');

  // Move to confirmation section
  addressSection.classList.add('hidden');
  confirmSection.classList.remove('hidden');
});


    function goHome() {
      window.location.href = "index.html";
    }

    renderCart();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
