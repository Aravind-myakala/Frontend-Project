<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieExpress | Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #fff8f5;
      font-family: 'Poppins', sans-serif;
    }
    .navbar-custom {
      background: linear-gradient(90deg, #ff512f, #dd2476);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .navbar-brand {
      color: #fff !important;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .nav-link {
      color: #fff !important;
    }
    .order-card {
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fff;
      margin-bottom: 20px;
      padding: 20px;
    }
    .order-header {
      background: linear-gradient(90deg, #ff512f, #dd2476);
      color: white;
      border-radius: 10px;
      padding: 10px;
    }
    .item {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">FoodieExpress</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="orders.html">Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <a class="btn btn-light ms-3 fw-semibold" href="cart.html">
          <i class="bi bi-cart"></i> Cart
        </a>
      </div>
    </div>
  </nav>

  <!-- Orders Section -->
  <div class="container my-5">
    <h2 class="text-center fw-bold mb-4" style="color:#dd2476;">📦 Your Orders</h2>
    <div id="ordersContainer"></div>
  </div>

  <button class="btn btn-danger" onclick="clearOrders()">Clear All Orders</button>


  <script>
    const ordersContainer = document.getElementById('ordersContainer');
    const orders = JSON.parse(localStorage.getItem('orders')) || [];

    if (orders.length === 0) {
      ordersContainer.innerHTML = `<p class="text-center text-muted">No orders placed yet.</p>`;
    } else {
      ordersContainer.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-header mb-3">
            <h5>Order #${order.id}</h5>
            <small>${order.date}</small>
          </div>
          <p><strong>Name:</strong> ${order.name}</p>
          <p><strong>Mobile:</strong> ${order.mobile}</p>
          <p><strong>Address:</strong> ${order.address}</p>
          <p><strong>Payment:</strong> ${order.paymentMethod}</p>
          <div class="mt-3">
            <h6 class="fw-bold">Items:</h6>
            ${order.items.map(i => `
              <div class="item d-flex justify-content-between">
                <span>${i.name} (x${i.qty})</span>
                <span>₹${i.price * i.qty}</span>
              </div>
            `).join('')}
          </div>
          <h5 class="text-end mt-3 text-success">Total: ₹${order.total}</h5>
        </div>
      `).join('');
    }

      function clearOrders() {
  localStorage.removeItem('orders');
  location.reload();
}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
